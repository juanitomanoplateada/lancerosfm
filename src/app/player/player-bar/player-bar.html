<section class="radio-player" aria-label="Reproductor de Lanceros Stereo 94.1 FM">
  <div class="radio-player__inner">
    <button
      type="button"
      class="play-btn"
      [class.is-busy]="isBusy()"
      [attr.aria-label]="isPlaying() ? 'Pausar la emisora' : 'Sintonizar la emisora en vivo'"
      (click)="toggle()"
    >
      @if (isPlaying()) {
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <rect x="6" y="4" width="4" height="16" rx="1" />
          <rect x="14" y="4" width="4" height="16" rx="1" />
        </svg>
      } @else if (isBusy()) {
        <svg
          class="spinner"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="3"
          stroke-linecap="round"
          aria-hidden="true"
        >
          <circle cx="12" cy="12" r="10" stroke-opacity="0.25" />
          <path d="M12 2a10 10 0 0 1 10 10" />
        </svg>
      } @else {
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path
            d="M6 3.8v16.4c0 .8.9 1.3 1.6.9l13-8.2c.6-.4.6-1.3 0-1.7l-13-8.2c-.7-.5-1.6 0-1.6.8z"
          />
        </svg>
      }
    </button>

    <!-- Un único anuncio para lectores de pantalla: lo que se ve va oculto para
         ellos, y así el artista y el título no se leen por partes. -->
    <p class="visually-hidden" aria-live="polite">{{ announcement() }}</p>

    @if (hasFailed()) {
      <div class="player-error">
        <span class="player-error__text">Sin conexión con la emisora</span>
        <button type="button" class="player-error__retry" (click)="retry()">Reintentar</button>
      </div>
    } @else {
      <p class="track" aria-hidden="true">
        @if (track().artist) {
          <span class="track__artist">{{ track().artist }}</span>
        }
        <span class="track__title" [class.track__title--alone]="!track().artist">{{
          displayTitle()
        }}</span>
      </p>
    }

    <!-- Solo en el celular, en el sitio que en pantallas anchas ocupa el volumen. -->
    <a
      class="request-btn"
      [href]="whatsappUrl"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="Pedir una canción por WhatsApp"
    >
      <app-whatsapp-icon class="request-btn__icon" />
    </a>

    <div class="volume-control">
      <button
        type="button"
        class="volume-btn"
        [attr.aria-label]="isMuted() ? 'Activar el sonido' : 'Silenciar'"
        (click)="toggleMute()"
      >
        <!-- El altavoz es siempre el mismo; lo que cambia es lo que sale de él:
             una equis en silencio, una onda con el volumen bajo y dos con el alto. -->
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2.2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="M11 5 6 9H2v6h4l5 4z" />
          @if (isMuted()) {
            <path d="m23 9-6 6M17 9l6 6" />
          } @else {
            <path d="M15.5 8.5a5 5 0 0 1 0 7" />
            @if (volume() >= 0.5) {
              <path d="M19 5a10 10 0 0 1 0 14" />
            }
          }
        </svg>
      </button>

      <!-- Donde el navegador no deja tocar el volumen, el deslizador sobra: el
           botón de silencio sí funciona en todas partes. -->
      @if (canSetVolume()) {
        <label class="visually-hidden" for="volume">Volumen</label>
        <input
          id="volume"
          type="range"
          min="0"
          max="1"
          step="0.05"
          [value]="volume()"
          [style.--volume-fill]="volumePercent() + '%'"
          [attr.aria-valuetext]="volumePercent() + ' por ciento'"
          (input)="changeVolume($event)"
        />
      }
    </div>
  </div>
</section>
