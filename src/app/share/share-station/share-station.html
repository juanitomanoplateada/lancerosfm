<div class="share">
  <a class="btn btn--whatsapp" [href]="whatsappUrl" target="_blank" rel="noopener noreferrer">
    Compartir por WhatsApp
  </a>
  <a class="btn btn--ghost" [href]="facebookUrl" target="_blank" rel="noopener noreferrer">
    Compartir en Facebook
  </a>
  <button type="button" class="btn btn--ghost" (click)="copyLink()">Copiar enlace</button>
</div>
