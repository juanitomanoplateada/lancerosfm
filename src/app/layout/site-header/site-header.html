<header class="navbar">
  <div class="container navbar__inner">
    <div class="navbar__brand">
      <a routerLink="/" class="navbar__logo" aria-label="Lanceros Stereo 94.1 FM, ir al inicio">
        Lanceros Stereo <span class="navbar__logo-highlight">94.1 FM</span>
      </a>

      @if (isPlaying()) {
        <p class="navbar__on-air">
          <span class="navbar__on-air-dot" aria-hidden="true"></span>
          <span class="navbar__on-air-label">Al aire</span>
        </p>
      }
    </div>

    <!-- En el celular esta lista no se ve: la misma navegación baja a la fila
         de pestañas (`app-tab-bar`). -->
    <nav class="navbar__nav" aria-label="Navegación principal">
      <ul>
        @for (item of items; track item.path) {
          <li>
            <a
              [routerLink]="item.path"
              routerLinkActive="is-active"
              ariaCurrentWhenActive="page"
              [routerLinkActiveOptions]="{ exact: item.exact }"
              >{{ item.label }}</a
            >
          </li>
        }
      </ul>
    </nav>
  </div>
</header>
