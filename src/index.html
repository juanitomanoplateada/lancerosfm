<!doctype html>
<html lang="es-CO">
  <head>
    <meta charset="utf-8" />
    <title>Lanceros Stereo 94.1 FM</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="google-site-verification"
      content="czurY6FHUhvg6d7PDB9bnbXs4RFN9BZgFhzH2CxPs9A"
    />

    <!-- El título, la descripción, el canónico y las etiquetas sociales los fija
         SeoService por ruta, y el prerender los deja escritos en cada HTML. -->

    <meta name="theme-color" content="#1d2e50" />
    <meta name="apple-mobile-web-app-title" content="Lanceros 94.1" />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="alternate icon" href="/favicon.ico" sizes="32x32" />
    <link rel="apple-touch-icon" href="/img/apple-touch-icon-180.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- La tipografía base es lo primero que se ve: se pide ya.
         El logo no se precarga aquí. Esta cabecera la comparten todas las rutas,
         así que se descargaría también en las páginas que no lo muestran, y el
         HTML prerenderizado de la portada ya trae la imagen con prioridad alta. -->
    <link
      rel="preload"
      href="/fonts/inter-var-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <!-- El audio arranca al primer clic: adelantamos el saludo TLS. -->
    <link rel="preconnect" href="https://stream.zeno.fm" crossorigin />
    <link rel="preconnect" href="https://api.zeno.fm" crossorigin />
  </head>

  <body>
    <app-root></app-root>
  </body>
</html>
